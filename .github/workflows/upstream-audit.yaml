name: Build and Push Upstream Audit

on:
  push:
    branches:
      - main
    paths:
      - 'tools/upstream-audit/**'
      - '.github/workflows/upstream-audit.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test audit server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run audit tests
        working-directory: tools/upstream-audit
        run: python -m unittest discover -s tests -v

  publish:
    name: Publish audit image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-audit" >> "$GITHUB_OUTPUT"
          echo "version=beta-${GITHUB_SHA:0:6}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push audit image
        uses: docker/build-push-action@v6
        with:
          context: tools/upstream-audit
          file: tools/upstream-audit/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          cache-from: type=gha,scope=upstream-audit
          cache-to: type=gha,mode=max,scope=upstream-audit
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:beta
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Upstream API audit monitor
            org.opencontainers.image.description=Independent HTTP and SSE observation relay
